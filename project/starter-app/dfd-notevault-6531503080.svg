<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DFD ของ NoteVault: Browser ข้าม trust boundary เข้าสู่ Flask app ซึ่งต่อกับ notes.db ผ่าน SQL ที่สร้างด้วย string formatting และต่อกับ OS shell ผ่าน /export ที่มี command injection">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c3a52" />
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff" />

  <line x1="210" y1="20" x2="210" y2="400" stroke="#b5601f" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="215" y="34" font-size="12" fill="#b5601f" font-family="sans-serif">TRUST BOUNDARY (Internet → Server)</text>

  <rect x="30" y="170" width="140" height="60" fill="none" stroke="#1c3a52" stroke-width="1.5" />
  <text x="100" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#1c3a52" font-family="sans-serif">Browser</text>
  <text x="100" y="214" text-anchor="middle" font-size="11" fill="#4c6478" font-family="sans-serif">(external entity)</text>

  <rect x="280" y="150" width="200" height="100" rx="16" fill="none" stroke="#1c3a52" stroke-width="1.5" />
  <text x="380" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#1c3a52" font-family="sans-serif">NoteVault (Flask)</text>
  <text x="380" y="200" text-anchor="middle" font-size="10" fill="#4c6478" font-family="sans-serif">/login /register /notes</text>
  <text x="380" y="214" text-anchor="middle" font-size="10" fill="#4c6478" font-family="sans-serif">/api/notes/&lt;id&gt; /search /admin /export</text>
  <text x="380" y="230" text-anchor="middle" font-size="11" fill="#4c6478" font-family="sans-serif">(process)</text>

  <line x1="600" y1="60" x2="740" y2="60" stroke="#1c3a52" stroke-width="1.5" />
  <line x1="600" y1="115" x2="740" y2="115" stroke="#1c3a52" stroke-width="1.5" />
  <text x="670" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3a52" font-family="sans-serif">notes.db</text>
  <text x="670" y="131" text-anchor="middle" font-size="10.5" fill="#4c6478" font-family="sans-serif">users + notes tables</text>

  <rect x="600" y="280" width="140" height="60" fill="none" stroke="#1c3a52" stroke-width="1.5" stroke-dasharray="3 3" />
  <text x="670" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3a52" font-family="sans-serif">OS shell</text>
  <text x="670" y="324" text-anchor="middle" font-size="10.5" fill="#4c6478" font-family="sans-serif">(via subprocess)</text>

  <line x1="170" y1="200" x2="276" y2="200" stroke="#1c3a52" stroke-width="2" marker-end="url(#arr2)" />
  <text x="223" y="188" text-anchor="middle" font-size="10.5" fill="#1c3a52" font-family="sans-serif">login/search/notes params</text>

  <line x1="470" y1="150" x2="605" y2="90" stroke="#b5601f" stroke-width="2.5" marker-end="url(#arr2)" />
  <text x="560" y="115" text-anchor="middle" font-size="10" fill="#b5601f" font-weight="600" font-family="sans-serif">SQL built via % string-format</text>

  <line x1="440" y1="250" x2="605" y2="292" stroke="#b5601f" stroke-width="2.5" marker-end="url(#arr2)" />
  <text x="540" y="278" text-anchor="middle" font-size="10" fill="#b5601f" font-weight="600" font-family="sans-serif">/export runs shell with fmt param</text>
</svg>
