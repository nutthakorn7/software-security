<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DFD ของ sample-app: Browser ส่ง request ข้าม trust boundary เข้าสู่ Flask app ซึ่งอ่าน/เขียน notes.db ผ่าน /notes และอ่าน/เขียน uploads/ ผ่าน /upload กับ /files/name">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c3a52" />
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="460" fill="#ffffff" />

  <!-- trust boundary -->
  <line x1="210" y1="20" x2="210" y2="440" stroke="#b5601f" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="215" y="34" font-size="12" fill="#b5601f" font-family="sans-serif">TRUST BOUNDARY (Internet → Server)</text>

  <!-- external entity: browser -->
  <rect x="30" y="200" width="140" height="60" fill="none" stroke="#1c3a52" stroke-width="1.5" />
  <text x="100" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#1c3a52" font-family="sans-serif">Browser</text>
  <text x="100" y="244" text-anchor="middle" font-size="11" fill="#4c6478" font-family="sans-serif">(external entity)</text>

  <!-- process: flask app -->
  <rect x="280" y="190" width="180" height="80" rx="16" fill="none" stroke="#1c3a52" stroke-width="1.5" />
  <text x="370" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#1c3a52" font-family="sans-serif">Flask app</text>
  <text x="370" y="240" text-anchor="middle" font-size="10.5" fill="#4c6478" font-family="sans-serif">/notes · /upload · /files/&lt;name&gt;</text>
  <text x="370" y="256" text-anchor="middle" font-size="11" fill="#4c6478" font-family="sans-serif">(process)</text>

  <!-- data store: notes.db -->
  <line x1="560" y1="70" x2="680" y2="70" stroke="#1c3a52" stroke-width="1.5" />
  <line x1="560" y1="120" x2="680" y2="120" stroke="#1c3a52" stroke-width="1.5" />
  <text x="620" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#1c3a52" font-family="sans-serif">notes.db</text>
  <text x="620" y="136" text-anchor="middle" font-size="11" fill="#4c6478" font-family="sans-serif">(data store — SQLite)</text>

  <!-- data store: uploads/ -->
  <line x1="560" y1="330" x2="680" y2="330" stroke="#1c3a52" stroke-width="1.5" />
  <line x1="560" y1="380" x2="680" y2="380" stroke="#1c3a52" stroke-width="1.5" />
  <text x="620" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#1c3a52" font-family="sans-serif">uploads/</text>
  <text x="620" y="396" text-anchor="middle" font-size="11" fill="#4c6478" font-family="sans-serif">(data store — files)</text>

  <!-- browser -> flask -->
  <line x1="170" y1="230" x2="276" y2="230" stroke="#1c3a52" stroke-width="2" marker-end="url(#arr)" />
  <text x="223" y="218" text-anchor="middle" font-size="10.5" fill="#1c3a52" font-family="sans-serif">request (owner/body, file+filename)</text>

  <!-- flask -> notes.db (read+write) -->
  <line x1="440" y1="188" x2="565" y2="110" stroke="#1c3a52" stroke-width="2" marker-end="url(#arr)" />
  <text x="530" y="155" text-anchor="middle" font-size="10.5" fill="#1c3a52" font-family="sans-serif">/notes — INSERT/SELECT</text>

  <!-- flask -> uploads write (vulnerable) -->
  <line x1="440" y1="255" x2="558" y2="335" stroke="#b5601f" stroke-width="2.5" marker-end="url(#arr)" />
  <text x="536" y="300" text-anchor="middle" font-size="10.5" fill="#b5601f" font-weight="600" font-family="sans-serif">/upload — writes raw filename</text>

  <!-- uploads -> flask read -->
  <path d="M 555 375 C 480 420, 420 400, 400 272" fill="none" stroke="#1c3a52" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" />
  <text x="470" y="430" text-anchor="middle" font-size="10.5" fill="#4c6478" font-family="sans-serif">/files/&lt;name&gt; — read (defended)</text>
</svg>
